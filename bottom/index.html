<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>吸底圖便捷編輯器</title>
  <script>
    (function () {
      try {
        var embed = new URLSearchParams(location.search).get('embed');
        if (embed === 'generator') {
          document.documentElement.classList.add('embed-generator');
        } else if (embed === 'import-preview') {
          document.documentElement.classList.add('embed-import-preview');
        } else if (embed === 'standalone') {
          document.documentElement.classList.add('embed-standalone');
        } else if (embed === 'maint-preview') {
          document.documentElement.classList.add('embed-maint-preview');
        }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="src/ui/style.css?v=20261019-logo-tools1" />
  <!-- TP 規則：暫存一律經過 BnStore；函式庫只從 cdnjs 載入，版本寫死並附 integrity。
       cdnjs 上 konva 只有 10.x 有檔案（9.x 是空的），所以用 10.10.0。 -->
  <script src="../shopee2/js/bn-store.js"></script>
  <script src="../shopee2/js/vendor/browser-loader.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/konva/10.10.0/konva.min.js" integrity="sha512-QUZcTHYj4/ijQfVL11UOdCdgcTFELZeXxln+W8cyPmbbQnjwptBcXc5G0EPr2UihbtzT+kTkYhUMXVZfwHZ/Mw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <!-- konva 10 預設把文字畫低約 2px；打開舊版文字排法，輸出跟 konva 9 一致。 -->
  <script>if (window.Konva) Konva.legacyTextRendering = true;</script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" integrity="sha512-XMVd28F1oH/O71fzwBnV7HucLxVwtxf26XV8P4wPk26EDxuGZ91N8bsOttmnomcCD3CS5ZMRL50H0GgOHvegtg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body>
  <div id="app">
    <!-- 分頁（多條吸底圖）獨立成滿版橫 Bar，跟一般欄位分開，一眼就看得到 -->
    <div id="tabbar"></div>

    <div id="workspace">
      <!-- 單獨開啟時維持畫布左／面板右；嵌入 BODA 時由 CSS 改為面板左／畫布右。 -->
      <main id="stage-wrap">
        <!-- 依規範：字體 100% 載入成功前不繪製畫布，避免字體閃爍或用錯字體匯出 -->
        <div id="font-status">
          <div class="spinner"></div>
          <p class="font-status-main">正在載入 ShopeeNotoSans 字體…</p>
          <p class="font-status-sub">
            首次載入約 10MB，需要幾秒鐘。<br />
            依規範必須等字體完全就緒才會繪製，以免匯出成錯誤字體。
          </p>
        </div>
        <div id="konva-container" hidden></div>
        <!-- 縮放列浮在畫布上方，只影響檢視，不影響匯出 -->
        <div id="zoom-bar" hidden></div>
      </main>
      <aside id="panel"></aside>
    </div>
  </div>

  <!-- 依相依順序載入的傳統 script（非 ES module），確保雙擊 index.html 用 file:// 開啟也能正常運作，不需要另外架 server -->
  <script src="src/util/textLimit.js"></script>
  <script src="src/state/actions.js?v=20261019-logo-tools1"></script>
  <script src="src/state/reducers.js?v=20261019-logo-tools1"></script>
  <script src="src/state/selectors.js?v=20261019-logo-tools1"></script>
  <script src="src/state/store.js?v=20261019-logo-tools1"></script>
  <script src="src/templates/templates.js?v=20261019-logo-tools1"></script>
  <script src="src/icons/manifest.js?v=20261110-hide-mdd"></script>
  <script src="src/integration/levelPreset.js?v=20260902-1"></script>
  <script src="src/state/projectFile.js?v=20261019-logo-tools1"></script>
  <script src="src/state/autoSave.js?v=20261019-logo-tools1"></script>
  <script src="src/render/colorTheme.js"></script>
  <script src="src/render/bgRemove.js"></script>
  <script src="src/render/fontLoader.js"></script>
  <script src="src/render/iconImageCache.js"></script>
  <script src="src/render/viewport.js"></script>
  <script src="src/render/canvas.js?v=20261019-logo-tools1"></script>
  <script src="src/export/exportBatch.js?v=20260930-variants1"></script>
  <script src="src/importers/workOrderImporter.js?v=20261110-quoted-sheet"></script>
  <script src="src/ui/imageEditor.js"></script>
  <script src="src/ui/zoomBar.js"></script>
  <script src="src/ui/iconPicker.js?v=20261019-logo-tools1"></script>
  <script src="src/ui/panel.js?v=20261110-page-download"></script>
  <!-- 主工具橋接沿用 PanelUI 的同一套匯入入口，不另寫第二套解析邏輯。 -->
  <script src="src/integration/parentBridge.js?v=20261019-folder-import1"></script>
  <!-- 開場對話框要用 PanelUI.mount() 交回來的匯入入口，所以排在 panel 之後 -->
  <script src="src/ui/startupDialog.js?v=20261019-logo-tools1"></script>
  <script src="src/app.js"></script>
</body>
</html>
