<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MS編輯器｜操作影片</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #151515;
      color: #f4f4f4;
      font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
    }
    main { width: min(1100px, 100%); }
    h1 { margin: 0 0 16px; font-size: clamp(20px, 3vw, 30px); }
    .video-shell {
      overflow: hidden;
      border: 1px solid #3b3b3b;
      border-radius: 12px;
      background: #000;
      box-shadow: 0 12px 40px rgba(0,0,0,.35);
    }
    video { display: block; width: 100%; height: auto; background: #000; }
    .note { margin: 12px 0 0; color: #aaa; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <h1>MS編輯器操作影片</h1>
    <div class="video-shell">
      <video controls preload="metadata" playsinline>
        <!-- GitHub Pages 會把 Git LFS 檔案當成 pointer 發布；改用 GitHub 的媒體端點取得實際影片。 -->
        <source src="https://media.githubusercontent.com/media/jimmywu-commits/MS/main/mov/MS_tutorial_merged_subtitled.mp4" type="video/mp4">
        您的瀏覽器不支援 HTML5 影片播放。
      </video>
    </div>
    <p class="note">若瀏覽器未自動播放，請按播放鍵開始觀看。</p>
  </main>
</body>
</html>
