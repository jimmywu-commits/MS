<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MS編輯器｜操作影片</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #111312;
      --panel: #191d1b;
      --line: #2a312e;
      --text: #eef3f0;
      --mute: #87918c;
      --accent: #5cc6a2;
      --accent-strong: #3a9d7e;
      --red: #e4473a;
      --sub-scale: 1;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text); }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
    }
    .player { width: min(1180px, 100%); }

    /* ── 頂部：標題＋階段 ─────────────────────────── */
    .topbar { display: flex; align-items: center; gap: 20px; margin-bottom: 12px; }
    .topbar h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: .02em; white-space: nowrap; }
    .stepper { list-style: none; margin: 0 0 0 auto; padding: 4px; display: flex; gap: 2px;
      background: var(--panel); border: 1px solid var(--line); border-radius: 999px; }
    .step { position: relative; display: flex; align-items: center; gap: 7px; height: 34px;
      padding: 0 12px 0 5px; border-radius: 999px; color: var(--mute); font-size: 13px;
      cursor: pointer; user-select: none; white-space: nowrap;
      transition: background-color .35s ease, color .35s ease; }
    .step:hover { color: var(--text); background: #222825; }
    .step .ico { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center;
      background: #232926; transition: background-color .35s ease, color .35s ease; }
    .step .ico svg { width: 14px; height: 14px; }
    .step .chk { display: none; }
    .step.done { color: #b9c9c1; }
    .step.done .ico { background: rgba(92,198,162,.16); color: var(--accent); }
    .step.done .ico .chk { display: block; }
    .step.done .ico .glyph { display: none; }
    .step.current { background: var(--accent-strong); color: #fff; }
    .step.current .ico { background: rgba(255,255,255,.95); color: var(--accent-strong); }
    .step.current .ico .chk { display: none; }
    .step.current .ico .glyph { display: block; }
    .step.is-dl.current { background: var(--red); }
    .step.is-dl.current .ico { color: var(--red); }
    .step .prog { position: absolute; left: 14px; right: 14px; bottom: 3px; height: 2px; border-radius: 2px;
      background: rgba(255,255,255,.25); overflow: hidden; opacity: 0; transition: opacity .3s; }
    .step .prog i { display: block; height: 100%; width: 0; background: #fff; }
    .step.current .prog { opacity: 1; }

    .chapter { display: flex; align-items: baseline; gap: 10px; min-height: 22px; margin: 0 0 10px 2px;
      font-size: 14px; color: var(--mute); }
    .chapter b { color: var(--accent); font-weight: 700; font-variant-numeric: tabular-nums; }
    .chapter span { color: var(--text); }
    .chapter .swap { animation: chapIn .45s cubic-bezier(.2,.8,.2,1); }
    @keyframes chapIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

    /* ── 影片區 ─────────────────────────────────── */
    .stage { position: relative; overflow: hidden; border-radius: 12px; background: #000;
      border: 1px solid #2b2f2d; box-shadow: 0 16px 48px rgba(0,0,0,.4); aspect-ratio: var(--video-ratio, 1916 / 908); }
    /* 沒有字幕檔／章節檔時，相關介面整組隱藏 */
    .no-subs #btnCc, .no-subs #btnSize, .no-subs .sub-layer, .no-subs .kbd-cc, .no-subs #noteMsg { display: none; }
    .no-guide .stepper, .no-guide .chapter { display: none; }
    #noteMsg.err { display: inline; color: #ff8a7a; }
    .stage video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
    .stage.hide-cursor { cursor: none; }

    /* 字幕層＝影片實際畫面範圍（JS 依 object-fit 計算） */
    .sub-layer { position: absolute; pointer-events: none; }
    .sub-box { position: absolute; left: 0; top: 0; max-width: 78%;
      transition: transform .42s cubic-bezier(.22,.8,.22,1), opacity .18s ease;
      opacity: 0; will-change: transform; }
    .sub-box.on { opacity: 1; }
    .sub-text { display: block; padding: .32em .78em .38em; border-radius: .42em;
      background: rgba(14,16,15,.80);
      -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
      box-shadow: 0 6px 22px rgba(0,0,0,.28);
      color: #fff; text-align: center; line-height: 1.5; letter-spacing: .03em;
      font-size: calc(var(--vh-px, 600px) * .043 * var(--sub-scale)); font-weight: 500;
      text-wrap: balance; word-break: keep-all; overflow-wrap: anywhere; white-space: pre-line;
      text-shadow: 0 1px 2px rgba(0,0,0,.45); }
    .sub-text b { color: #8ff0cb; font-weight: 700; }
    .sub-text .ln { display: inline-block; }
    .sub-text.swap { animation: subSwap .22s ease; }
    @keyframes subSwap { from { opacity: .15; transform: translateY(3px); } to { opacity: 1; transform: none; } }

    /* 示範用：游標追蹤框 */
    .dbg-cursor { position: absolute; border: 2px solid #ffcf3d; border-radius: 4px; pointer-events: none; display: none;
      box-shadow: 0 0 0 9999px rgba(0,0,0,0); }
    .dbg-zone { position: absolute; border: 1px dashed rgba(255,207,61,.6); pointer-events: none; display: none; }
    .debug .dbg-cursor, .debug .dbg-zone { display: block; }

    .big-play { position: absolute; inset: 0; margin: auto; width: 84px; height: 84px; border-radius: 50%;
      border: 0; background: rgba(20,22,21,.72); color: #fff; cursor: pointer; display: grid; place-items: center;
      -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
      box-shadow: 0 10px 30px rgba(0,0,0,.35); transition: transform .2s, opacity .25s; }
    .big-play:hover { transform: scale(1.06); }
    .big-play svg { width: 34px; height: 34px; margin-left: 5px; }
    .played .big-play { opacity: 0; pointer-events: none; }

    /* ── 控制列 ─────────────────────────────────── */
    .controls { position: absolute; left: 0; right: 0; bottom: 0; padding: 26px 14px 10px;
      background: linear-gradient(to top, rgba(0,0,0,.72), rgba(0,0,0,0));
      transition: opacity .3s ease, transform .3s ease; }
    .controls.idle { opacity: 0; transform: translateY(6px); pointer-events: none; }
    .seek { position: relative; height: 18px; cursor: pointer; touch-action: none; }
    .seek .rail { position: absolute; left: 0; right: 0; top: 7px; height: 4px; border-radius: 4px;
      background: rgba(255,255,255,.2); transition: top .15s, height .15s; }
    .seek:hover .rail, .seek.drag .rail { top: 6px; height: 6px; }
    .seek .buf, .seek .done { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 4px; }
    .seek .buf { background: rgba(255,255,255,.28); }
    .seek .done { background: var(--accent); }
    .seek .tick { position: absolute; top: -1px; bottom: -1px; width: 3px; margin-left: -1.5px; background: rgba(0,0,0,.75); }
    .seek .knob { position: absolute; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%;
      background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.4); transform: scale(0); transition: transform .15s; }
    .seek:hover .knob, .seek.drag .knob { transform: scale(1); }
    .seek .tip { position: absolute; bottom: 22px; transform: translateX(-50%); padding: 6px 10px; border-radius: 8px;
      background: rgba(18,20,19,.94); border: 1px solid #333a37; font-size: 12px; white-space: nowrap;
      opacity: 0; pointer-events: none; transition: opacity .15s; }
    .seek .tip em { font-style: normal; color: var(--accent); margin-right: 6px; font-variant-numeric: tabular-nums; }
    .seek:hover .tip, .seek.drag .tip { opacity: 1; }
    .bar { display: flex; align-items: center; gap: 4px; margin-top: 4px; }
    .btn { height: 34px; min-width: 34px; padding: 0 8px; border: 0; border-radius: 8px; background: transparent;
      color: #fff; font: inherit; font-size: 13px; cursor: pointer; display: inline-grid; place-items: center; }
    .btn:hover { background: rgba(255,255,255,.12); }
    .btn svg { width: 20px; height: 20px; }
    .btn.off { opacity: .45; }
    .time { font-size: 13px; color: #dfe6e2; font-variant-numeric: tabular-nums; margin: 0 8px; }
    .grow { flex: 1; }
    .cc-badge { border: 1.6px solid currentColor; border-radius: 4px; padding: 0 4px; font-size: 11px; font-weight: 700; line-height: 16px; }

    .note { margin: 12px 2px 0; color: #8b9590; font-size: 13px; display: flex; gap: 16px; flex-wrap: wrap; }
    .note a { color: var(--accent); text-decoration: none; }
    .note kbd { font: inherit; font-size: 11px; padding: 1px 6px; border: 1px solid #3a423e; border-radius: 4px; color: #c9d3ce; }

    /* 全螢幕：整個播放器（含階段列與字幕）一起進全螢幕 */
    .player:fullscreen { width: 100%; height: 100%; padding: 14px 18px 18px; background: #000;
      display: flex; flex-direction: column; }
    .player:fullscreen .stage { flex: 1; aspect-ratio: auto; border-radius: 8px; }
    .player:fullscreen .note { display: none; }

    @media (max-width: 980px) {
      .topbar { flex-wrap: wrap; }
      .stepper { margin-left: 0; width: 100%; justify-content: space-between; }
      .step .lbl { display: none; }
      .step.current .lbl { display: inline; }
    }
  </style>
</head>
<body>
  <main class="player" id="player">
    <header class="topbar">
      <h1>MS編輯器操作影片</h1>
      <ol class="stepper" id="stepper" aria-label="操作階段"></ol>
    </header>
    <div class="chapter" id="chapter" aria-live="polite"></div>

    <div class="stage" id="stage">
      <video id="tutorial" playsinline preload="metadata"></video>
      <div class="sub-layer" id="subLayer">
        <div class="dbg-zone" id="dbgZone"></div>
        <div class="dbg-cursor" id="dbgCursor"></div>
        <div class="sub-box" id="subBox"><span class="sub-text" id="subText"></span></div>
      </div>
      <button class="big-play" id="bigPlay" aria-label="播放">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>
      </button>
      <div class="controls" id="controls">
        <div class="seek" id="seek">
          <div class="rail"><div class="buf" id="seekBuf"></div><div class="done" id="seekDone"></div><div id="seekTicks"></div></div>
          <div class="knob" id="seekKnob"></div>
          <div class="tip" id="seekTip"></div>
        </div>
        <div class="bar">
          <button class="btn" id="btnPlay" aria-label="播放／暫停"></button>
          <span class="time" id="time">0:00 / 0:00</span>
          <span class="grow"></span>
          <button class="btn" id="btnCc" aria-label="字幕開關" title="字幕（C）"><span class="cc-badge">字幕</span></button>
          <button class="btn" id="btnSize" aria-label="字幕大小" title="字幕大小">字級 中</button>
          <button class="btn" id="btnRate" aria-label="播放速度" title="播放速度">1×</button>
          <button class="btn" id="btnFs" aria-label="全螢幕" title="全螢幕（F）">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
          </button>
        </div>
      </div>
    </div>
    <p class="note" id="note">
      <span id="noteMsg">字幕檔：<a href="MS_tutorial.zh-TW.srt" download>MS_tutorial.zh-TW.srt</a></span>
      <span><kbd>空白鍵</kbd> 播放／暫停　<kbd>←</kbd><kbd>→</kbd> 前後 5 秒　<span class="kbd-cc"><kbd>C</kbd> 字幕　</span><kbd>F</kbd> 全螢幕</span>
    </p>
  </main>
<script>
(function () {
  'use strict';
  var MANIFEST_URL = 'MS_tutorial.json';
  var SRT_URL = 'MS_tutorial.zh-TW.srt';
  var GUIDE_URL = 'MS_tutorial.guide.json';

  var player = document.getElementById('player');
  var stage = document.getElementById('stage');
  var video = document.getElementById('tutorial');
  var noteMsg = document.getElementById('noteMsg');
  function fail(msg) { noteMsg.textContent = msg; noteMsg.classList.add('err'); }

  /* ════════════════ 影片載入（沿用原本 MSE 分段播放） ════════════════ */
  var AHEAD_PLAYING = 60, AHEAD_IDLE = 12, KEEP_BEHIND = 30, CHUNK_BYTES = 6 * 1024 * 1024;

  function fetchRange(url, start, end, signal) {
    return fetch(url, { headers: { Range: 'bytes=' + start + '-' + (end - 1) }, signal: signal })
      .then(function (res) {
        if (res.status === 206) return res.arrayBuffer();
        if (!res.ok) throw new Error('HTTP ' + res.status + '：' + url);
        var reader = res.body.getReader();
        var out = new Uint8Array(end - start);
        var pos = 0, filled = 0;
        function pump() {
          return reader.read().then(function (r) {
            if (r.done) throw new Error('檔案提前結束：' + url);
            var chunk = r.value;
            var cStart = pos, cEnd = pos + chunk.length;
            pos = cEnd;
            var a = Math.max(start, cStart), b = Math.min(end, cEnd);
            if (b > a) { out.set(chunk.subarray(a - cStart, b - cStart), a - start); filled += b - a; }
            if (filled >= end - start) { reader.cancel(); return out.buffer; }
            return pump();
          });
        }
        return pump();
      });
  }

  function startMse(m) {
    var MS = window.ManagedMediaSource || window.MediaSource;
    if (!MS || !MS.isTypeSupported(m.mime)) return false;
    var ms = new MS();
    if (window.ManagedMediaSource && MS === window.ManagedMediaSource) video.disableRemotePlayback = true;
    video.src = URL.createObjectURL(ms);
    var frags = m.fragments.map(function (f) { return { part: f[0], offset: f[1], size: f[2], t: f[3] }; });
    var sb = null, next = 0, busy = false, controller = null, ended = false, started = false;
    function waitIdle() {
      if (!sb.updating) return Promise.resolve();
      return new Promise(function (r) { sb.addEventListener('updateend', r, { once: true }); });
    }
    function append(buf) {
      return waitIdle().then(function () {
        return new Promise(function (resolve, reject) {
          function done() { sb.removeEventListener('error', bad); resolve(); }
          function bad() { sb.removeEventListener('updateend', done); reject(new Error('影片資料無法播放')); }
          sb.addEventListener('updateend', done, { once: true });
          sb.addEventListener('error', bad, { once: true });
          try { sb.appendBuffer(buf); } catch (e) {
            sb.removeEventListener('updateend', done); sb.removeEventListener('error', bad); reject(e);
          }
        });
      });
    }
    function remove(a, b) {
      if (!(b > a)) return Promise.resolve();
      return waitIdle().then(function () {
        return new Promise(function (r) { sb.addEventListener('updateend', r, { once: true }); sb.remove(a, b); });
      });
    }
    function bufferedEndAt(t) {
      var br = video.buffered;
      for (var i = 0; i < br.length; i++) if (t >= br.start(i) - 0.3 && t <= br.end(i) + 0.05) return br.end(i);
      return -1;
    }
    function fragIndexAt(t) { var i = 0; while (i + 1 < frags.length && frags[i + 1].t <= t) i++; return i; }
    function evict() {
      var t = video.currentTime, jobs = Promise.resolve(), br = video.buffered;
      for (var i = 0; i < br.length; i++) {
        var s = br.start(i), e = br.end(i);
        if (e < t - KEEP_BEHIND || s > t + AHEAD_PLAYING * 2) jobs = jobs.then(remove.bind(null, s, e));
        else if (s < t - KEEP_BEHIND) jobs = jobs.then(remove.bind(null, s, t - KEEP_BEHIND));
      }
      return jobs;
    }
    function appendWithRetry(buf) {
      return append(buf).catch(function (err) {
        if (err && err.name === 'QuotaExceededError') return evict().then(function () { return append(buf); });
        throw err;
      });
    }
    function pump() {
      if (!sb || busy) return;
      if (next >= frags.length) {
        if (!ended && ms.readyState === 'open' && !sb.updating) { ended = true; try { ms.endOfStream(); } catch (e) {} }
        return;
      }
      var t = video.currentTime, bEnd = bufferedEndAt(t), ahead = bEnd < 0 ? 0 : bEnd - t;
      if (ahead > (started ? AHEAD_PLAYING : AHEAD_IDLE)) return;
      var first = next, last = next, bytes = frags[next].size;
      while (last + 1 < frags.length && frags[last + 1].part === frags[first].part && bytes + frags[last + 1].size <= CHUNK_BYTES) {
        last++; bytes += frags[last].size;
      }
      var part = m.parts[frags[first].part];
      busy = true;
      controller = new AbortController();
      var myController = controller;
      fetchRange(part.file, frags[first].offset, frags[last].offset + frags[last].size, controller.signal)
        .then(function (buf) {
          if (myController !== controller) return;
          return evict().then(function () { return appendWithRetry(buf); }).then(function () {
            if (myController === controller) next = last + 1;
          });
        })
        .then(function () { if (myController === controller) { busy = false; pump(); } })
        .catch(function (err) {
          if (myController !== controller) return;
          busy = false;
          if (err && err.name === 'AbortError') return;
          fail('影片載入中斷：' + (err && err.message ? err.message : err) + '（重新整理頁面可再試一次）');
        });
    }
    video.addEventListener('seeking', function () {
      if (!sb) return;
      var t = video.currentTime, bEnd = bufferedEndAt(t);
      var target = bEnd >= 0 ? Math.min(fragIndexAt(Math.max(0, bEnd - 0.5)) + 1, frags.length) : fragIndexAt(t);
      if (target === next && busy) return;
      if (controller) controller.abort();
      controller = null; busy = false; ended = false; next = target;
      waitIdle().then(pump);
    });
    video.addEventListener('play', function () { started = true; pump(); });
    video.addEventListener('timeupdate', pump);
    video.addEventListener('waiting', pump);
    ms.addEventListener('sourceopen', function () {
      if (sb) return;
      try { ms.duration = m.duration; sb = ms.addSourceBuffer(m.mime); }
      catch (e) { fail('這個瀏覽器無法播放這支影片：' + e.message); return; }
      busy = true;
      fetchRange(m.parts[0].file, 0, m.initSize)
        .then(append)
        .then(function () { busy = false; pump(); })
        .catch(function (err) { busy = false; fail('影片載入失敗：' + (err && err.message ? err.message : err)); });
    }, { once: true });
    return true;
  }
  function startSequential(m) {
    var i = 0;
    function load(n, autoplay) { i = n; video.src = m.parts[n].file; if (autoplay) video.play().catch(function () {}); }
    video.addEventListener('ended', function () { if (i + 1 < m.parts.length) load(i + 1, true); });
    load(0, false);
  }

  var manifest = null;
  fetch(MANIFEST_URL, { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw new Error('找不到 ' + MANIFEST_URL); return r.json(); })
    .then(function (m) { manifest = m; buildTicks(); if (!startMse(m)) startSequential(m); })
    .catch(function (err) { fail('影片載入失敗：' + (err && err.message ? err.message : err)); });

  function duration() {
    var d = video.duration;
    return isFinite(d) && d > 0 ? d : (manifest ? manifest.duration : 0);
  }

  /* ════════════════ SRT 字幕 ════════════════ */
  var cues = [];
  function srtTime(s) {
    var m = /(\d+):(\d{1,2}):(\d{1,2})[,.](\d{1,3})/.exec(s);
    return m ? (+m[1]) * 3600 + (+m[2]) * 60 + (+m[3]) + (+m[4]) / Math.pow(10, m[4].length) : NaN;
  }
  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  /* SRT 只允許 <b> <i> <u> <font color>，其餘一律當純文字 */
  function cueHtml(text) {
    var h = escapeHtml(text);
    h = h.replace(/&lt;(\/?)(b|i|u)&gt;/gi, '<$1$2>');
    h = h.replace(/&lt;font\s+color=&quot;?(#[0-9a-f]{3,8}|[a-z]+)&quot;?\s*&gt;/gi, '<span style="color:$1">');
    h = h.replace(/&lt;\/font&gt;/gi, '</span>');
    return h.split('\n').map(function (l) { return '<span class="ln">' + l + '</span>'; }).join('\n');
  }
  function parseSrt(txt) {
    var out = [];
    txt.replace(/^﻿/, '').replace(/\r\n?/g, '\n').split(/\n{2,}/).forEach(function (block) {
      var lines = block.split('\n').filter(function (l, i) { return l.trim() !== '' || i > 1; });
      var k = -1;
      for (var i = 0; i < lines.length; i++) if (lines[i].indexOf('-->') >= 0) { k = i; break; }
      if (k < 0) return;
      var p = lines[k].split('-->');
      var a = srtTime(p[0]), b = srtTime(p[1]);
      if (!(b > a)) return;
      var raw = lines.slice(k + 1).join('\n').trim();
      var top = /\{\\an[789]\}/.test(raw);           /* {\an8}：固定放上方 */
      raw = raw.replace(/\{\\[^}]*\}/g, '');
      out.push({ start: a, end: b, top: top, html: cueHtml(raw) });
    });
    out.sort(function (x, y) { return x.start - y.start; });
    return out;
  }
  /* 字幕檔可有可無：沒有（或是空的）就把字幕相關按鈕整組藏起來 */
  player.classList.add('no-subs');
  fetch(SRT_URL, { cache: 'no-cache' })
    .then(function (r) { return r.ok ? r.text() : ''; })
    .then(function (t) { cues = parseSrt(t); if (cues.length) player.classList.remove('no-subs'); })
    .catch(function () {});

  function cueAt(t) {
    var lo = 0, hi = cues.length - 1;
    while (lo <= hi) {
      var mid = (lo + hi) >> 1;
      if (cues[mid].end <= t) lo = mid + 1;
      else if (cues[mid].start > t) hi = mid - 1;
      else return cues[mid];
    }
    return null;
  }

  /* ════════════════ 章節／階段＋游標資料 ════════════════ */
  var guide = { stages: [], chapters: [], cursor: null };
  var ICONS = {
    home: '<path d="M3 11.5 12 4l9 7.5M5.5 9.5V20h13V9.5"/>',
    exposure: '<rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="m3.5 16 5-5 4 4 3-3 5 5"/><circle cx="15.5" cy="9" r="1.5"/>',
    import: '<rect x="3.5" y="4" width="17" height="6.5" rx="1.5"/><rect x="3.5" y="13.5" width="7.5" height="6.5" rx="1.5"/><rect x="13" y="13.5" width="7.5" height="6.5" rx="1.5"/>',
    color: '<path d="M12 21s-6.5-6.2-6.5-11a6.5 6.5 0 0 1 13 0C18.5 14.8 12 21 12 21z"/><circle cx="12" cy="10" r="2.3"/>',
    bottom: '<rect x="4" y="3.5" width="16" height="17" rx="2"/><path d="M4 15.5h16M8 18h2M14 18h2"/>',
    download: '<path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M4.5 19.5h15"/>'
  };
  var CHECK = '<path d="m5 12.5 4.2 4.2L19 7"/>';
  var stepEls = [];

  function buildStepper() {
    var ol = document.getElementById('stepper');
    ol.innerHTML = '';
    stepEls = guide.stages.map(function (s) {
      var li = document.createElement('li');
      li.className = 'step' + (s.id === 'download' ? ' is-dl' : '');
      li.innerHTML = '<span class="ico"><svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
        (ICONS[s.id] || '') + '</svg><svg class="chk" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">' + CHECK +
        '</svg></span><span class="lbl">' + escapeHtml(s.name) + '</span><span class="prog"><i></i></span>';
      li.title = '跳到「' + s.name + '」';
      li.addEventListener('click', function () {
        var c = guide.chapters.filter(function (ch) { return ch.stage === s.id; })[0];
        if (c) seekTo(c.start + 0.05);
      });
      ol.appendChild(li);
      return li;
    });
  }
  function chapterIndexAt(t) {
    var ch = guide.chapters, idx = -1;
    for (var i = 0; i < ch.length; i++) if (ch[i].start <= t) idx = i;
    return idx;
  }
  var lastChap = -2;
  function updateStages(t) {
    var ci = chapterIndexAt(t);
    if (ci < 0) ci = 0;
    var ch = guide.chapters[ci];
    if (!ch) return;
    var visited = {};
    for (var i = 0; i < ci; i++) visited[guide.chapters[i].stage] = true;
    guide.stages.forEach(function (s, i) {
      var el = stepEls[i];
      var cur = s.id === ch.stage;
      el.classList.toggle('current', cur);
      el.classList.toggle('done', !cur && !!visited[s.id]);
    });
    var si = guide.stages.findIndex(function (s) { return s.id === ch.stage; });
    if (si >= 0) {
      var p = Math.min(1, Math.max(0, (t - ch.start) / Math.max(0.1, ch.end - ch.start)));
      stepEls[si].querySelector('.prog i').style.width = (p * 100).toFixed(1) + '%';
    }
    if (ci !== lastChap) {
      lastChap = ci;
      var st = guide.stages[si];
      var el = document.getElementById('chapter');
      el.innerHTML = '<span class="swap"><b>' + String(si + 1).padStart(2, '0') + '</b>　<span>' +
        escapeHtml(st ? st.name : '') + '</span>' + (ch.title ? '　·　' + escapeHtml(ch.title) : '') + '</span>';
    }
  }
  function buildTicks() {
    var d = manifest ? manifest.duration : duration();
    var box = document.getElementById('seekTicks');
    if (!d || !guide.chapters.length) return;
    box.innerHTML = '';
    var lastTick = 0;
    guide.chapters.forEach(function (c, i) {
      if (i === 0 || c.start - lastTick < d * 0.012) return;   /* 太近的刻度合併，不擠成一團 */
      lastTick = c.start;
      var tk = document.createElement('div');
      tk.className = 'tick';
      tk.style.left = (c.start / d * 100) + '%';
      box.appendChild(tk);
    });
  }

  /* 游標：5 fps 取樣的外框 [x, y, w, h]（影片像素，含點擊光圈），0＝畫面上沒有游標 */
  function cursorRectAt(t) {
    var c = guide.cursor;
    if (!c) return null;
    var p = c.box[Math.round(t * c.fps)];
    return p ? { x: p[0], y: p[1], w: p[2], h: p[3] } : null;
  }

  /* 章節／游標資料也可有可無：沒有就不顯示階段列與章節列 */
  player.classList.add('no-guide');
  fetch(GUIDE_URL, { cache: 'no-cache' })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (g) {
      if (!g || !g.chapters || !g.chapters.length) return;
      guide = g; player.classList.remove('no-guide');
      buildStepper(); buildTicks(); updateStages(video.currentTime || 0);
    })
    .catch(function () {});

  /* ════════════════ 字幕排版與避開游標 ════════════════ */
  var subLayer = document.getElementById('subLayer');
  var subBox = document.getElementById('subBox');
  var subText = document.getElementById('subText');
  var dbgCursor = document.getElementById('dbgCursor');
  var dbgZone = document.getElementById('dbgZone');
  var controls = document.getElementById('controls');
  /* 影片尺寸以實際讀到的為準（換影片不用改程式） */
  var VW = 1916, VH = 908;
  var rect = { x: 0, y: 0, w: 0, h: 0 };
  video.addEventListener('loadedmetadata', function () {
    if (!video.videoWidth || !video.videoHeight) return;
    VW = video.videoWidth; VH = video.videoHeight;
    player.style.setProperty('--video-ratio', VW + ' / ' + VH);
    layoutLayer();
  });

  function layoutLayer() {
    var w = stage.clientWidth, h = stage.clientHeight;
    var s = Math.min(w / VW, h / VH);
    rect.w = VW * s; rect.h = VH * s; rect.x = (w - rect.w) / 2; rect.y = (h - rect.h) / 2;
    subLayer.style.left = rect.x + 'px'; subLayer.style.top = rect.y + 'px';
    subLayer.style.width = rect.w + 'px'; subLayer.style.height = rect.h + 'px';
    player.style.setProperty('--vh-px', rect.h + 'px');
  }
  new ResizeObserver(layoutLayer).observe(stage);
  layoutLayer();

  var shownCue = null;
  var place = { mode: 'default', x: 0, y: 0, since: 0 };
  var LOOK_BEHIND = 0.3, LOOK_AHEAD = 1.0, MIN_HOLD = 1.2;

  function overlaps(a, b, pad) {
    return a.x - pad < b.x + b.w && a.x + a.w + pad > b.x && a.y - pad < b.y + b.h && a.y + a.h + pad > b.y;
  }
  function cursorWindow(t) {
    var list = [], k = rect.w / VW;
    for (var dt = -LOOK_BEHIND; dt <= LOOK_AHEAD + 1e-6; dt += 0.2) {
      var r = cursorRectAt(t + dt);
      if (r) list.push({ x: r.x * k, y: r.y * k, w: r.w * k, h: r.h * k });
    }
    return list;
  }
  function placeSub(t, now) {
    var bw = subBox.offsetWidth, bh = subBox.offsetHeight;
    var ctrlVisible = !controls.classList.contains('idle');
    var gap = rect.h * 0.045;
    var bottomY = rect.h - bh - (ctrlVisible ? Math.max(gap, controls.offsetHeight - rect.y + 8) : gap);
    var cx = (rect.w - bw) / 2, side = rect.w * 0.035, pad = rect.h * 0.018;
    var cur = cursorWindow(t);
    function hits(x, y) {
      var b = { x: x, y: y, w: bw, h: bh };
      for (var i = 0; i < cur.length; i++) if (overlaps(b, cur[i], pad)) return true;
      return false;
    }
    /* 左右閃避只挪到剛好避開游標的位置（決定當下算好就固定，不跟著游標抖動） */
    function nudgeX(mode) {
      var minL = Infinity, maxR = -Infinity;
      cur.forEach(function (c) { minL = Math.min(minL, c.x); maxR = Math.max(maxR, c.x + c.w); });
      if (mode === 'left') return Math.max(side, Math.min(cx, minL - pad * 2 - bw));
      return Math.min(rect.w - bw - side, Math.max(cx, maxR + pad * 2));
    }
    function pos(mode) {
      if (mode === 'default') return { x: cx, y: bottomY };
      if (mode === 'left' || mode === 'right') return { x: place.mode === mode ? place.x : nudgeX(mode), y: bottomY };
      if (mode === 'top') return { x: cx, y: gap };
      return { x: cx, y: place.y };                     /* raise：沿用決定當下的高度 */
    }
    var want;
    if (shownCue && shownCue.top) want = 'top';
    else if (!hits(cx, bottomY)) {
      /* 預設位置淨空：剛移開不到 MIN_HOLD 秒且目前位置也安全，就先別急著回來，避免來回跳 */
      want = (place.mode !== 'default' && now - place.since < MIN_HOLD * 1000 && !hits(pos(place.mode).x, pos(place.mode).y)) ? place.mode : 'default';
    } else if (place.mode !== 'default' && !hits(pos(place.mode).x, pos(place.mode).y)) {
      want = place.mode;
    } else {
      var avgX = 0; cur.forEach(function (c) { avgX += c.x + c.w / 2; }); avgX /= Math.max(1, cur.length);
      var order = avgX < rect.w / 2 ? ['right', 'left'] : ['left', 'right'];
      want = null;
      for (var i = 0; i < order.length; i++) { var p = pos(order[i]); if (!hits(p.x, p.y)) { want = order[i]; break; } }
      if (!want) {
        var topMost = Math.min.apply(null, cur.map(function (c) { return c.y; }));
        var ry = topMost - bh - pad * 2;
        if (ry > rect.h * 0.45 && !hits(cx, ry)) { want = 'raise'; place.y = ry; }
        else want = 'top';
      }
    }
    if (want !== place.mode) {
      if (want === 'left' || want === 'right') place.x = nudgeX(want);
      place.mode = want; place.since = now;
    }
    var p2 = pos(place.mode);
    subBox.style.transform = 'translate(' + Math.round(p2.x) + 'px,' + Math.round(p2.y) + 'px)';

    if (player.classList.contains('debug')) {
      var r0 = cursorRectAt(t), k = rect.w / VW;
      if (r0) {
        dbgCursor.style.display = '';
        dbgCursor.style.left = r0.x * k + 'px'; dbgCursor.style.top = r0.y * k + 'px';
        dbgCursor.style.width = r0.w * k + 'px'; dbgCursor.style.height = r0.h * k + 'px';
      } else dbgCursor.style.display = 'none';
      dbgZone.style.left = cx + 'px'; dbgZone.style.top = bottomY + 'px';
      dbgZone.style.width = bw + 'px'; dbgZone.style.height = bh + 'px';
    }
  }

  var ccOn = true;
  var hideTimer = 0;
  function renderSub(now) {
    var t = video.currentTime;
    var c = ccOn ? cueAt(t) : null;
    if (c !== shownCue) {
      if (c) {
        var wasShown = !!shownCue;
        subText.innerHTML = c.html;
        if (wasShown) { subText.classList.remove('swap'); void subText.offsetWidth; subText.classList.add('swap'); }
        clearTimeout(hideTimer);
        subBox.classList.add('on');
      } else {
        /* 下一句在 0.35 秒內接上就不閃掉底框 */
        var nxt = cues.filter(function (q) { return q.start > t; })[0];
        if (!(nxt && nxt.start - t < 0.35)) subBox.classList.remove('on');
      }
      shownCue = c;
    }
    if (shownCue || subBox.classList.contains('on')) placeSub(t, now);
    else if (player.classList.contains('debug')) placeSub(t, now);
  }

  /* ════════════════ 控制列 ════════════════ */
  var btnPlay = document.getElementById('btnPlay');
  var timeEl = document.getElementById('time');
  var seek = document.getElementById('seek');
  var seekDone = document.getElementById('seekDone');
  var seekBuf = document.getElementById('seekBuf');
  var seekKnob = document.getElementById('seekKnob');
  var seekTip = document.getElementById('seekTip');
  var ICON_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>';
  var ICON_PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4.5" width="4" height="15" rx="1"/><rect x="14" y="4.5" width="4" height="15" rx="1"/></svg>';

  function fmt(s) { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
  function seekTo(t) { video.currentTime = Math.max(0, Math.min(duration() - 0.05, t)); }
  function togglePlay() { if (video.paused) video.play().catch(function () {}); else video.pause(); }

  document.getElementById('bigPlay').addEventListener('click', togglePlay);
  btnPlay.addEventListener('click', togglePlay);
  video.addEventListener('click', togglePlay);
  video.addEventListener('dblclick', toggleFs);
  video.addEventListener('play', function () { stage.classList.add('played'); btnPlay.innerHTML = ICON_PAUSE; poke(); });
  video.addEventListener('pause', function () { btnPlay.innerHTML = ICON_PLAY; showControls(); });
  btnPlay.innerHTML = ICON_PLAY;

  var idleTimer = 0;
  function showControls() { controls.classList.remove('idle'); stage.classList.remove('hide-cursor'); }
  function poke() {
    showControls();
    clearTimeout(idleTimer);
    idleTimer = setTimeout(function () {
      if (!video.paused && !seek.classList.contains('drag')) { controls.classList.add('idle'); stage.classList.add('hide-cursor'); }
    }, 2200);
  }
  stage.addEventListener('mousemove', poke);
  stage.addEventListener('mouseleave', function () { if (!video.paused) { controls.classList.add('idle'); } });

  function ratioFromEvent(e) {
    var r = seek.getBoundingClientRect();
    return Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
  }
  seek.addEventListener('pointermove', function (e) {
    var d = duration(), t = ratioFromEvent(e) * d;
    var ci = chapterIndexAt(t), ch = guide.chapters[ci], st = ch && guide.stages.find(function (s) { return s.id === ch.stage; });
    seekTip.innerHTML = '<em>' + fmt(t) + '</em>' + escapeHtml(st ? st.name + (ch.title ? '・' + ch.title : '') : '');
    var r = seek.getBoundingClientRect(), x = e.clientX - r.left, half = seekTip.offsetWidth / 2;
    seekTip.style.left = Math.min(r.width - half, Math.max(half, x)) + 'px';
    if (seek.classList.contains('drag')) seekTo(t);
  });
  seek.addEventListener('pointerdown', function (e) {
    seek.setPointerCapture(e.pointerId); seek.classList.add('drag'); seekTo(ratioFromEvent(e) * duration());
  });
  seek.addEventListener('pointerup', function (e) { seek.classList.remove('drag'); seek.releasePointerCapture(e.pointerId); poke(); });

  var btnCc = document.getElementById('btnCc');
  function setCc(on) { ccOn = on; btnCc.classList.toggle('off', !on); if (!on) { subBox.classList.remove('on'); shownCue = null; } save(); }
  btnCc.addEventListener('click', function () { setCc(!ccOn); });

  var SIZES = [['小', 0.82], ['中', 1], ['大', 1.22]], sizeIdx = 1;
  var btnSize = document.getElementById('btnSize');
  function setSize(i) { sizeIdx = (i + SIZES.length) % SIZES.length; player.style.setProperty('--sub-scale', SIZES[sizeIdx][1]); btnSize.textContent = '字級 ' + SIZES[sizeIdx][0]; save(); }
  btnSize.addEventListener('click', function () { setSize(sizeIdx + 1); });

  var RATES = [1, 1.25, 1.5, 2, 0.75], rateIdx = 0;
  var btnRate = document.getElementById('btnRate');
  btnRate.addEventListener('click', function () { rateIdx = (rateIdx + 1) % RATES.length; video.playbackRate = RATES[rateIdx]; btnRate.textContent = RATES[rateIdx] + '×'; });

  function toggleFs() {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (player.requestFullscreen) player.requestFullscreen().catch(function () {});
    else if (video.webkitEnterFullscreen) video.webkitEnterFullscreen();
  }
  document.getElementById('btnFs').addEventListener('click', toggleFs);

  document.addEventListener('keydown', function (e) {
    if (e.target && /input|textarea|select/i.test(e.target.tagName)) return;
    var k = e.key.toLowerCase();
    if (k === ' ' || k === 'k') { e.preventDefault(); togglePlay(); }
    else if (k === 'arrowleft') { seekTo(video.currentTime - 5); poke(); }
    else if (k === 'arrowright') { seekTo(video.currentTime + 5); poke(); }
    else if (k === 'c') setCc(!ccOn);
    else if (k === 'f') toggleFs();
    else if (k === 'd') player.classList.toggle('debug');
  });

  /* 記住字幕開關與字級：TP 上用 tpArtifact.kv（TP 不允許瀏覽器儲存空間），其他環境就只記在這次瀏覽 */
  var PREF_KEY = 'ms-tutorial-sub';
  function prefStore() { return window.tpArtifact && window.tpArtifact.kv ? window.tpArtifact.kv : null; }
  function save() {
    var kv = prefStore();
    if (kv) Promise.resolve(kv.set(PREF_KEY, JSON.stringify({ cc: ccOn, size: sizeIdx }))).catch(function () {});
  }
  function loadPref() {
    var kv = prefStore();
    if (!kv) return;
    Promise.resolve(kv.get(PREF_KEY)).then(function (raw) {
      var pref = raw ? JSON.parse(raw) : null;
      if (pref) { ccOn = pref.cc !== false; setSize(pref.size == null ? 1 : pref.size); btnCc.classList.toggle('off', !ccOn); }
    }).catch(function () {});
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', loadPref); else loadPref();

  function tick(now) {
    var d = duration(), t = video.currentTime;
    if (d) {
      var p = t / d * 100;
      seekDone.style.width = p + '%'; seekKnob.style.left = p + '%';
      var br = video.buffered, be = 0;
      for (var i = 0; i < br.length; i++) if (br.start(i) <= t + 0.5) be = Math.max(be, br.end(i));
      seekBuf.style.width = (be / d * 100) + '%';
      timeEl.textContent = fmt(t) + ' / ' + fmt(d);
    }
    if (guide.chapters.length) updateStages(t);
    renderSub(now);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
